<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <style>
      .bg{fill:#0e1116;}
      .panel{fill:#141a22;}
      .line{fill:none;stroke:#2a323d;stroke-width:1;}
      .muted{fill:#8b94a1;}
      .fg{fill:#e6e9ef;}
      .accent{fill:#e3b76b;}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;}
      .sans{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
    </style>
  </defs>

  <rect class="bg" width="1200" height="420"/>

  <!-- side panel -->
  <rect class="panel" x="780" y="40" width="380" height="340" rx="14"/>
  <rect class="line" x="780" y="40" width="380" height="340" rx="14"/>

  <text x="808" y="100" class="muted sans" font-size="13" letter-spacing="2">WINDOWS LAN AGENT</text>

  <text x="808" y="168" class="fg sans" font-size="46" font-weight="700" letter-spacing="-1">Nanaininai</text>

  <text x="808" y="232" class="muted sans" font-size="18">lanagent.exe</text>

  <text x="808" y="286" class="fg sans" font-size="15">
    A terminal tool that prepares a Windows PC for the LAN:
    networking, SMB sharing, and mapped drives.
  </text>

  <!-- pipeline strip -->
  <g transform="translate(808 340)">
    <rect class="panel" width="340" height="42" rx="8"/>
    <rect class="line" width="340" height="42" rx="8"/>
    <text x="16" y="28" class="fg mono" font-size="14">SCAN → DIAGNOSE → PLAN → CONFIRM → APPLY → VERIFY → REPORT</text>
  </g>

  <!-- left stage blocks -->
  <g transform="translate(40 40)">
    <!-- header -->
    <text x="0" y="42" class="muted sans" font-size="13" letter-spacing="2">WORKFLOW</text>

    <!-- stage tiles -->
    <g font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle">
      <g transform="translate(0 70)">
        <rect class="panel" x="-72" y="0" width="144" height="64" rx="10"/>
        <rect class="line" x="-72" y="0" width="144" height="64" rx="10"/>
        <text y="34" class="fg" font-weight="600">SCAN</text>
        <text y="52" class="muted" font-size="12">discover the LAN</text>
      </g>

      <g transform="translate(190 70)">
        <rect class="panel" x="-72" y="0" width="144" height="64" rx="10"/>
        <rect class="line" x="-72" y="0" width="144" height="64" rx="10"/>
        <text y="34" class="fg" font-weight="600">DIAGNOSE</text>
        <text y="52" class="muted" font-size="12">11-test battery</text>
      </g>

      <g transform="translate(380 70)">
        <rect class="panel" x="-72" y="0" width="144" height="64" rx="10"/>
        <rect class="line" x="-72" y="0" width="144" height="64" rx="10"/>
        <text y="34" class="fg" font-weight="600">PLAN</text>
        <text y="52" class="muted" font-size="12">IP allocation</text>
      </g>

      <g transform="translate(570 70)">
        <rect class="panel" x="-72" y="0" width="144" height="64" rx="10"/>
        <rect class="line" x="-72" y="0" width="144" height="64" rx="10"/>
        <text y="34" class="fg" font-weight="600">CONFIRM</text>
        <text y="52" class="muted" font-size="12">preview first</text>
      </g>

      <g transform="translate(760 70)">
        <rect class="panel" x="-72" y="0" width="144" height="64" rx="10"/>
        <rect class="line" x="-72" y="0" width="144" height="64" rx="10"/>
        <text y="34" class="fg" font-weight="600">APPLY</text>
        <text y="52" class="muted" font-size="12">with rollback</text>
      </g>

      <g transform="translate(945 70)">
        <rect class="panel" x="-60" y="0" width="120" height="64" rx="10"/>
        <rect class="line" x="-60" y="0" width="120" height="64" rx="10"/>
        <text y="34" class="fg" font-weight="600">VERIFY</text>
        <text y="52" class="muted" font-size="12">CHECK LAN</text>
      </g>

      <!-- arrow from VERIFY to REPORT on the panel -->
      <g transform="translate(1015 60)">
        <rect class="panel" x="-62" y="0" width="124" height="64" rx="10"/>
        <rect class="line" x="-62" y="0" width="124" height="64" rx="10"/>
        <text y="34" class="fg" font-weight="600">REPORT</text>
        <text y="52" class="muted" font-size="12">JSONL + score</text>
      </g>
    </g>

    <!-- connecting chevrons -->
    <g fill="#3a4452">
      <path d="M122 102 L140 102 L132 94 Z"/>
      <path d="M312 102 L330 102 L322 94 Z"/>
      <path d="M502 102 L520 102 L512 94 Z"/>
      <path d="M692 102 L710 102 L702 94 Z"/>
      <path d="M882 102 L900 102 L892 94 Z"/>
    </g>
  </g>

  <!-- value strip -->
  <g transform="translate(40 300)">
    <rect class="panel" x="0" y="0" width="690" height="84" rx="12"/>
    <rect class="line" x="0" y="0" width="690" height="84" rx="12"/>

    <g transform="translate(24 28)">
      <rect class="accent" x="0" y="0" width="8" height="8" rx="2"/>
      <text class="fg sans" font-size="16" font-weight="600">From unconfigured PC to validated LAN node.</text>
    </g>

    <g transform="translate(24 58)">
      <rect class="accent" x="0" y="0" width="8" height="8" rx="2"/>
      <text class="muted sans" font-size="13">Connectivity · SMB sharing · optional mapped drives · rollback snapshot · dry-run on every change.</text>
    </g>
  </g>

  <!-- bottom tag -->
  <text x="40" y="402" class="muted sans" font-size="12" letter-spacing="2">.NET 10  ·  Windows 10/11  ·  TUI + CLI</text>
</svg>
