<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="100%">
  <defs>
    <style>
      .bg{fill:#0e1116;}
      .panel{fill:#141a22;}
      .line{fill:none;stroke:#2a323d;stroke-width:1;}
      .muted{fill:#8b94a1;}
      .fg{fill:#e6e9ef;}
      .accent{fill:#e3b76b;}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;}
      .sans{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
    </style>
  </defs>

  <rect class="bg" width="1200" height="120"/>

  <!-- title -->
  <text x="40" y="52" class="fg sans" font-size="24" font-weight="700" letter-spacing="-0.5">Workflow</text>
  <text x="40" y="78" class="muted sans" font-size="14">The same pipeline every feature follows: scan, diagnose, plan, confirm, apply, verify, report.</text>

  <!-- stage strip -->
  <g transform="translate(40 104)">
    <g font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">
      <g transform="translate(0 0)">
        <rect class="panel" x="-46" y="-14" width="92" height="28" rx="7"/>
        <rect class="line" x="-46" y="-14" width="92" height="28" rx="7"/>
        <text y="4" class="fg" font-weight="600">SCAN</text>
      </g>
      <path d="M50 0 L58 0 L54 -6 Z" fill="#3a4452"/>
      <g transform="translate(64 0)">
        <rect class="panel" x="-46" y="-14" width="92" height="28" rx="7"/>
        <rect class="line" x="-46" y="-14" width="92" height="28" rx="7"/>
        <text y="4" class="fg" font-weight="600">DIAGNOSE</text>
      </g>
      <path d="M114 0 L122 0 L118 -6 Z" fill="#3a4452"/>
      <g transform="translate(128 0)">
        <rect class="panel" x="-40" y="-14" width="80" height="28" rx="7"/>
        <rect class="line" x="-40" y="-14" width="80" height="28" rx="7"/>
        <text y="4" class="fg" font-weight="600">PLAN</text>
      </g>
      <path d="M172 0 L180 0 L176 -6 Z" fill="#3a4452"/>
      <g transform="translate(184 0)">
        <rect class="panel" x="-46" y="-14" width="92" height="28" rx="7"/>
        <rect class="line" x="-46" y="-14" width="92" height="28" rx="7"/>
        <text y="4" class="fg" font-weight="600">CONFIRM</text>
      </g>
      <path d="M234 0 L242 0 L238 -6 Z" fill="#3a4452"/>
      <g transform="translate(248 0)">
        <rect class="panel" x="-40" y="-14" width="80" height="28" rx="7"/>
        <rect class="line" x="-40" y="-14" width="80" height="28" rx="7"/>
        <text y="4" class="fg" font-weight="600">APPLY</text>
      </g>
      <path d="M292 0 L300 0 L296 -6 Z" fill="#3a4452"/>
      <g transform="translate(304 0)">
        <rect class="panel" x="-42" y="-14" width="84" height="28" rx="7"/>
        <rect class="line" x="-42" y="-14" width="84" height="28" rx="7"/>
        <text y="4" class="fg" font-weight="600">VERIFY</text>
      </g>
      <path d="M350 0 L358 0 L354 -6 Z" fill="#3a4452"/>
      <g transform="translate(362 0)">
        <rect class="panel" x="-46" y="-14" width="92" height="28" rx="7"/>
        <rect class="line" x="-46" y="-14" width="92" height="28" rx="7"/>
        <text y="4" class="fg" font-weight="600">REPORT</text>
      </g>
    </g>
  </g>
</svg>
